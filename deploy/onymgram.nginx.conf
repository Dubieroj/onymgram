# Onymgram at https://foldy.io/onymgram/, included from the foldy.io server block. Static files only: the app talks
# to Onym relays and Blossom straight from the browser, so nothing here sees a message. No access logs.
location = /onymgram {
    return 301 /onymgram/;
}
location ^~ /onymgram/ {
    access_log off;
    alias /var/lib/onymgram/site/;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # The page's own CSP comes in index.html; this adds what a meta tag cannot say
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Cache-Control no-cache always;
    location ~ /\. { deny all; }
    # Content-hashed file names never change meaning, so they can be kept
    location ^~ /onymgram/assets/ {
        access_log off;
        alias /var/lib/onymgram/site/assets/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
